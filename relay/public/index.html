<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Мафия — игра на расстоянии</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app"></div>

  <div id="chat-dock" class="chat-dock hidden">
    <div class="chat-head">💬 Чат мафии</div>
    <div class="chat-log" id="chat-log"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" maxlength="300" autocomplete="off" placeholder="Сообщение...">
      <button type="submit" class="chat-send" aria-label="Отправить">➤</button>
    </form>
    <button class="chat-toggle" data-action="toggle-chat" aria-label="Чат">
      💬<span id="chat-badge" class="chat-badge hidden">0</span>
    </button>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var stored = '';
      try { stored = localStorage.getItem('mafia_relay_code') || ''; } catch (_) {}
      var code = (params.get('room') || stored || '').trim().toUpperCase();
      if (code) {
        try { localStorage.setItem('mafia_relay_code', code); } catch (_) {}
      }
      window.MAFIA_RELAY = { code: code };
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
